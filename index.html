<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>YY Rate List</title>
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',system-ui,serif;background:#f8f1e3;color:#2b2320}
.serif{font-family:Georgia,'Times New Roman',serif}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f8f1e3}
.login-card{background:#fffdf8;border:1px solid #e3d3ac;border-radius:20px;padding:36px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 18px 44px -18px rgba(92,10,30,.35)}
.emblem{width:92px;height:92px;margin:0 auto;border:2px solid #c9962e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#5c0a1e;background:#fff;letter-spacing:1px}
.login-card h1{font-size:26px;color:#5c0a1e;margin:16px 0 4px;font-weight:700}
.login-card p.sub{font-size:12px;color:#a07c2c;letter-spacing:3px;margin-bottom:22px}
.login-card input{width:100%;font-size:16px;font-family:system-ui,sans-serif;padding:13px 14px;margin-bottom:12px;border:1.5px solid #c9962e;border-radius:12px;background:#fff}
.login-card input:focus{outline:none;border-color:#5c0a1e}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;font-family:system-ui,sans-serif;color:#7a6a58;margin:2px 0 14px;text-align:left}
.remember input{width:auto;margin:0}
#loginBtn{width:100%;font-size:17px;font-weight:700;font-family:system-ui,sans-serif;padding:14px;background:linear-gradient(135deg,#6d0d22,#5c0a1e);color:#f5e7c8;border:none;border-radius:12px;cursor:pointer}
#loginErr{color:#b3261e;font-size:13px;font-family:system-ui,sans-serif;margin-top:10px;min-height:18px}
#app{display:none}
.header{background:#fffdf8;text-align:center;padding:28px 18px 22px;border-bottom:1px solid #e3d3ac}
.header .emblem{width:84px;height:84px;font-size:30px}
.shop{font-size:30px;font-weight:700;color:#5c0a1e;margin-top:14px}
.shopsub{font-size:12px;color:#a07c2c;letter-spacing:4px;margin-top:6px}
.rule{width:44px;height:2px;background:#c9962e;margin:14px auto 0}
.install-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#6d0d22,#5c0a1e);color:#f5e7c8;font-weight:700;font-family:system-ui,sans-serif;font-size:15px;padding:11px 24px;border-radius:40px;border:none;cursor:pointer;margin-top:16px}
#logout{display:block;margin:12px auto 0;background:none;border:none;color:#a07c2c;font-size:13px;font-family:system-ui,sans-serif;cursor:pointer;text-decoration:underline}
.searchbox{padding:24px 16px 6px;text-align:center;max-width:620px;margin:0 auto}
#q{width:100%;font-size:20px;font-family:system-ui,sans-serif;padding:16px;border:1.5px solid #c9962e;border-radius:14px;text-align:center;background:#fff;color:#2b2320}
#q:focus{outline:none;border-color:#5c0a1e}
#go{width:100%;margin-top:12px;font-size:18px;font-family:system-ui,sans-serif;padding:14px;background:linear-gradient(135deg,#6d0d22,#5c0a1e);color:#f5e7c8;border:none;border-radius:14px;cursor:pointer;font-weight:700}
.hint{font-size:13px;font-family:system-ui,sans-serif;color:#8a765c;margin-top:12px}
#results{padding:18px 14px 34px;max-width:620px;margin:0 auto}
.card{background:#fffdf8;border:1px solid #e3d3ac;border-radius:20px;overflow:hidden;margin-bottom:20px;box-shadow:0 12px 30px -14px rgba(92,10,30,.28);padding:14px}
.photoframe{background:#fff;border:1px solid #eee0bd;border-radius:14px;padding:10px}
.card img.photo{width:100%;display:block;border-radius:8px;background:#f1e8d2}
.nophoto{padding:36px 16px;text-align:center;color:#8a765c;font-size:14px;font-family:system-ui,sans-serif}
.cnlabel{text-align:center;color:#8a2a3c;font-size:14px;margin-top:16px}
.cardno{font-size:30px;font-weight:700;color:#5c0a1e;text-align:center;margin-top:2px}
.badges{text-align:center;margin-top:8px}
.badge{display:inline-block;font-size:12px;font-family:system-ui,sans-serif;font-weight:700;padding:4px 14px;border-radius:20px;margin:2px 3px;background:#f3e9d2;color:#7c5a12;border:1px solid #c9962e}
.rateboxes{display:flex;gap:12px;margin-top:16px}
.rbox{flex:1;border-radius:14px;padding:18px 8px;text-align:center;color:#fff}
.rbox.maroon{background:linear-gradient(160deg,#7a1030,#5c0a1e)}
.rbox.gold{background:linear-gradient(160deg,#d9a83f,#b8860b)}
.rbox .amt{font-size:30px;font-weight:700}
.rbox .lbl{font-size:13px;font-family:system-ui,sans-serif;margin-top:5px;opacity:.92}
.per100{text-align:center;font-size:13px;font-family:system-ui,sans-serif;color:#7a6a58;margin-top:10px}
.avail{margin-top:14px;border-radius:12px;padding:13px;text-align:center;font-family:system-ui,sans-serif}
.avail.ok{background:#e6f4e4;color:#2e7d32}
.avail.no{background:#fbe9e7;color:#b3261e}
.avail .a1{font-size:17px;font-weight:700}
.avail .a2{font-size:12px;margin-top:3px;opacity:.85}
.inforow{display:flex;gap:10px;margin-top:12px}
.info{flex:1;background:#fff;border:1px solid #e3d3ac;border-radius:12px;padding:11px 8px;text-align:center}
.info .k{font-size:12px;color:#8a2a3c;font-family:system-ui,sans-serif}
.info .v{font-size:15px;font-weight:700;color:#2b2320;margin-top:3px}
.note{margin-top:12px;text-align:center;font-size:15px;color:#5c0a1e;background:#f3e9d2;border-radius:10px;padding:11px;font-weight:600}
.notfound{text-align:center;padding:34px 16px;color:#8a765c;font-size:16px;font-family:system-ui,sans-serif}
.empty{text-align:center;padding:38px 16px;color:#8a765c;font-family:system-ui,sans-serif}
.empty h3{font-size:19px;color:#5c0a1e;margin-bottom:8px;font-family:Georgia,serif}
.footer{text-align:center;font-size:12px;font-family:system-ui,sans-serif;color:#a08b6a;padding:20px 12px 30px}
</style>
</head>

<div id="gate">

</div>

</div>

async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function showApp(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';render()}
try{if(localStorage.getItem(LS_KEY)==='1'||sessionStorage.getItem(LS_KEY)==='1')showApp()}catch(e){}
async function tryLogin(){
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
  if(await sha256(u+':'+p)===AUTH_HASH){
    try{if(document.getElementById('rm').checked)localStorage.setItem(LS_KEY,'1');else sessionStorage.setItem(LS_KEY,'1')}catch(e){}
    showApp();
  } else { document.getElementById('loginErr').textContent='Wrong username or password'; }
}
document.getElementById('loginBtn').addEventListener('click',tryLogin);
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
document.getElementById('logout').addEventListener('click',()=>{try{localStorage.removeItem(LS_KEY);sessionStorage.removeItem(LS_KEY)}catch(e){}location.reload()});

function fmt(x){ if(x==null) return '—'; const v=Math.round(x*100)/100; return (v%1===0? v.toLocaleString('en-US') : v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:2})); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function cardHTML(d){
  const img = d.img ? '<div class="photoframe"><img class="photo" loading="lazy" src="'+d.img+'" alt="Card '+d.n+'"></div>' : '<div class="photoframe"><div class="nophoto">Photo not available</div></div>';
  const grp = d.c==='fancy' ? 'YY Fancy' : 'YY Simpal';
  let boxes = '<div class="rbox maroon"><div class="amt">Rs '+fmt(d.r)+'</div><div class="lbl">Card Rate</div></div>';
  if(d.i!=null) boxes += '<div class="rbox gold"><div class="amt">Rs '+fmt(d.i)+'</div><div class="lbl">Extra Inner Rate</div></div>';
  let extras='';
  if(d.m!=null) extras+='<div class="info"><div class="k">Motif Rate</div><div class="v">Rs '+fmt(d.m)+'</div></div>';
  if(d.p!=null) extras+='<div class="info"><div class="k">Paste Rate</div><div class="v">Rs '+fmt(d.p)+'</div></div>';
  const ok = d.st==='in_stock';
  const avail = '<div class="avail '+(ok?'ok':'no')+'"><div class="a1">'+(ok?'● Available':'● Not Available')+'</div>'+(d.up?'<div class="a2">Updated: '+d.up+'</div>':'')+'</div>';
  let infos='';
  if(d.size) infos+='<div class="info"><div class="k">Size</div><div class="v">'+esc(d.size)+'</div></div>';
  if(d.cat) infos+='<div class="info"><div class="k">Category</div><div class="v">'+esc(d.cat)+'</div></div>';
  if(d.mat) infos+='<div class="info"><div class="k">Material</div><div class="v">'+esc(d.mat)+'</div></div>';
  const note = d.note ? '<div class="note">Note: '+esc(d.note)+'</div>' : '';
  return '<div class="card">'+img
    +'<div class="cnlabel">Card Number</div><div class="cardno">'+d.n+'</div>'
    +'<div class="badges"><span class="badge">'+grp+'</span></div>'
    +'<div class="rateboxes">'+boxes+'</div>'
    +'<div class="per100">Rs '+fmt(d.r*100)+' per 100 cards</div>'
    +(extras?'<div class="inforow">'+extras+'</div>':'')
    +avail
    +(infos?'<div class="inforow">'+infos+'</div>':'')
    +note+'</div>';
}
function render(){
  const q=document.getElementById('q').value.trim();
  const box=document.getElementById('results');
  if(q){
    let list=DATA.filter(d=>d.n===q||d.n.startsWith(q)||d.n.includes(q));
    list.sort((a,b)=> (a.n===q?0:1)-(b.n===q?0:1) || a.n.localeCompare(b.n,undefined,{numeric:true}));
    box.innerHTML = list.length ? list.map(cardHTML).join('') : '<div class="notfound">Is number ka card nahi mila.</div>';
  } else {
    box.innerHTML='<div class="empty"><h3>Card Number Likhein</h3>Card number likh kar Search dabayein — photo aur rate aa jayega.</div>';
  }
}
document.getElementById('go').addEventListener('click',render);
document.getElementById('q').addEventListener('input',render);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});

/* PWA install */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='inline-flex'});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'}
  else{alert('Install karne ke liye Chrome menu (⋮) se "Install app" / "Add to Home screen" select karein.')}
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
